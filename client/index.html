<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A1A" />
    <script>
      // Apply the saved theme before first paint (see src/context/ThemeContext.jsx)
      try {
        var pref = localStorage.getItem('codelings_theme') || 'system';
        if (pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEF1FF');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Codelings" />
    <meta name="description" content="Learn to code one bite-sized lesson at a time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <title>Codelings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
